<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 5; opacity: 0.6; }
        50% { r: 8; opacity: 1; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .floating-pill-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-pill-2 { animation: floatReverse 8s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow 6s ease-in-out infinite 1s; }
      .pulse-ambient { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .network-line { stroke: #6366f1; stroke-opacity: 0.25; stroke-dasharray: 6 4; animation: dashFlow 12s linear infinite; }
      .node-pulse { animation: pulseNode 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Ambient Glowing Orbs (in background) -->
  <g class="pulse-ambient">
    <circle cx="200" cy="100" r="140" fill="#4338ca" filter="url(#blurGlow)" />
    <circle cx="1000" cy="300" r="160" fill="#9333ea" filter="url(#blurGlow)" />
    <circle cx="600" cy="360" r="120" fill="#06b6d4" filter="url(#blurGlow)" opacity="0.3" />
  </g>

  <!-- Dynamic Background Network Mesh (Connecting Relationship Graph) -->
  <g>
    <line x1="80" y1="120" x2="250" y2="70" class="network-line" />
    <line x1="250" y1="70" x2="380" y2="160" class="network-line" />
    <line x1="150" y1="320" x2="280" y2="350" class="network-line" />
    <line x1="280" y1="350" x2="420" y2="280" class="network-line" />
    <line x1="820" y1="80" x2="960" y2="130" class="network-line" />
    <line x1="960" y1="130" x2="1100" y2="70" class="network-line" />
    <line x1="920" y1="330" x2="1050" y2="260" class="network-line" />
    <line x1="1050" y1="260" x2="1140" y2="340" class="network-line" />

    <!-- Animated Graph Nodes -->
    <circle cx="80" cy="120" fill="#818cf8" class="node-pulse" />
    <circle cx="250" cy="70" fill="#c084fc" class="node-pulse" />
    <circle cx="380" cy="160" fill="#38bdf8" class="node-pulse" />
    <circle cx="150" cy="320" fill="#f472b6" class="node-pulse" />
    <circle cx="280" cy="350" fill="#818cf8" class="node-pulse" />
    <circle cx="420" cy="280" fill="#34d399" class="node-pulse" />
    <circle cx="820" cy="80" fill="#38bdf8" class="node-pulse" />
    <circle cx="960" cy="130" fill="#c084fc" class="node-pulse" />
    <circle cx="1100" cy="70" fill="#f472b6" class="node-pulse" />
    <circle cx="920" cy="330" fill="#34d399" class="node-pulse" />
    <circle cx="1050" cy="260" fill="#818cf8" class="node-pulse" />
    <circle cx="1140" cy="340" fill="#c084fc" class="node-pulse" />
  </g>

  <!-- Dynamic Ambient Badges / Pills (Floating in the wings, never obstructing text) -->
  <!-- Top Left Wing Pill -->
  <g class="floating-pill-1" transform="translate(70, 45)">
    <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="90" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📇 CardDAV &amp; vCard</text>
  </g>

  <!-- Bottom Left Wing Pill -->
  <g class="floating-pill-2" transform="translate(60, 335)">
    <rect width="210" height="38" rx="19" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="105" y="24" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Sovereign &amp; Self-Hosted</text>
  </g>

  <!-- Top Right Wing Pill -->
  <g class="floating-pill-2" transform="translate(950, 45)">
    <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="90" y="24" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">✨ AI Network Intel</text>
  </g>

  <!-- Bottom Right Wing Pill -->
  <g class="floating-pill-3" transform="translate(930, 335)">
    <rect width="210" height="38" rx="19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="105" y="24" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Keep-In-Touch Cadence</text>
  </g>

  <!-- FOREGROUND: Main Title & Subtitles (Completely Clear & Layered on Top) -->
  <g filter="url(#shadowFilter)">
    <!-- Category Badge -->
    <rect x="475" y="65" width="250" height="30" rx="15" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="85" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="155" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" text-anchor="middle">Personal CRM &amp; Contact Management</text>

    <!-- Gradient Divider Line -->
    <rect x="420" y="178" width="360" height="3.5" rx="1.75" fill="url(#glowGrad)" />

    <!-- Subtitle Line 1 -->
    <text x="600" y="222" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" text-anchor="middle">SaaS Platforms, Open-Source PRMs, Network Intelligence &amp; CardDAV Ecosystem</text>

    <!-- Subtitle Line 2 / Tagline -->
    <text x="600" y="258" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Built for Founders • Community Builders • Dealmakers • Privacy Advocates • Self-Hosters</text>
  </g>

  <!-- Center Bottom Status Bar -->
  <g transform="translate(360, 290)">
    <rect width="480" height="42" rx="21" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="28" cy="21" r="5" fill="#10b981" />
    <text x="44" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Continuous 2026 Directory</text>
    <text x="235" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">•</text>
    <text x="255" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CardDAV / CalDAV</text>
    <text x="395" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">•</text>
    <text x="415" y="26" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">vCard 4.0</text>
  </g>
</svg>
